name: Scheduled Drought Risk Analysis

on:
  # Schedule the job to run every day at 10:00 AM UTC
  schedule:
    - cron: '0 10 * * *'  # Fixed: was missing the last asterisk
  
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Added timeout to prevent indefinite runs
    
    # Enhanced permissions for GitHub Pages deployment
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # Ensure full history for proper commits
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # Cache pip dependencies for faster builds
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy geopandas requests openpyxl shapely pyproj
          # Install additional dependencies that might be needed
          pip install matplotlib seaborn folium
          
      - name: Verify Required Files
        run: |
          echo "Checking for required files..."
          ls -la
          if [ ! -f "water_table.py" ]; then
            echo "Error: water_table.py not found"
            exit 1
          fi
          echo "Required files verified"
          
      - name: Run Water Table Analysis Script
        run: |
          echo "Starting drought risk analysis..."
          python water_table.py
          echo "Analysis completed"
          
      - name: Verify Output Files
        run: |
          echo "Checking generated files..."
          ls -la *.html *.csv *.json || echo "Some output files may be missing"
          
      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4
        
      - name: Upload Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Commit and Push Updated Output
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: '*.html *.csv *.json'
          commit_message: '🤖 Automated: Update drought risk analysis report [skip ci]'
          skip_dirty_check: true
          add_options: '--force'
          
      - name: Report Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Drought risk analysis completed successfully"
            echo "📊 Report available at: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "❌ Drought risk analysis failed"
            echo "Check the logs above for detailed error information"
          fi
